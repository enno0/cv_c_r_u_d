<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Task List</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>

<body>
    <h1>Task List</h1>
    <table id="taskTable">
        <thead>
            <tr>
                <th>ID</th>
                <th>title</th>
                <th>description</th>
                <th>status</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            <!-- User rows will be appended here -->
        </tbody>
    </table>

    <script>
        $(document).ready(function () {
            fetchTasks();
        });

        function fetchTasks() {
            $.ajax({
                url: '/api/tasks',
                type: 'GET',
                success: function (tasks) {
                    console.log('Tasks fetched successfully:', tasks); // Log for debugging
                    const taskTable = $('#taskTable tbody');
                    taskTable.empty();
                    tasks.forEach(task => {
                        taskTable.append(`
                            <tr>
                                <td>${task.id}</td>
                                <td>${task.title}</td>
                                <td>${task.description}</td>
                                <td>${task.status}</td>
                                <td>
                                    <button onclick="editTask(${task.id})">Edit</button>
                                    <button onclick="deleteTask(${task.id})">Delete</button>
                                </td>
                                <td><button onclick="createTask()">Create</button></td>
                            </tr>
                        `);
                    });
                },
                error: function (xhr, status, error) {
                    console.error('Error fetching tasks:', xhr.responseText); // Log for debugging
                    alert('Error fetching tasks: ' + xhr.responseText);
                }
            });
        }

        function deleteTask(taskId) {
            $.ajax({
                url: `/api/tasks/${taskId}`,
                type: 'DELETE',
                success: function () {
                    alert('task deleted successfully');
                    fetchTasks();
                },
                error: function (xhr, status, error) {
                    console.error('Error deleting task:', xhr.responseText); // Log for debugging
                    alert('Error deleting task: ' + xhr.responseText);
                }
            });
        }

        function editTask(taskId) {
            window.location.href = `manage_tasks?id=${taskId}`;
        }
        function createTask() {
            window.location.href = `manage_tasks`;
        }
    </script>
</body>

</html>
